{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Cybersecurity Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/styleheader.css' %}">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <h2><i class="fas fa-shield-alt"></i> SecAdmin</h2>
            </div>

            <nav class="nav-menu">
                <a href="{% url 'home' %}" class="nav-link">
                    <i class="fas fa-home"></i> Bosh sahifa
                </a>
                <a href="{% url 'dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                    <i class="fas fa-chart-line"></i> Dashboard
                </a>
                <a href="{% url 'users' %}" class="nav-link {% if request.resolver_match.url_name == 'users' %}active{% endif %}">
                    <i class="fas fa-users"></i> Foydalanuvchilar
                </a>
                <a href="{% url 'roles' %}" class="nav-link {% if request.resolver_match.url_name == 'roles' %}active{% endif %}">
                    <i class="fas fa-shield-halved"></i> Rollar
                </a>
                <a href="{% url 'devices' %}" class="nav-link {% if request.resolver_match.url_name == 'devices' %}active{% endif %}">
                    <i class="fas fa-desktop"></i> Qurilmalar
                </a>
                <a href="{% url 'logs' %}" class="nav-link {% if request.resolver_match.url_name == 'logs' %}active{% endif %}">
                    <i class="fas fa-list-check"></i> Kirish loglari
                </a>
            </nav>
        </aside>
        <main class="main-content">
            {% include 'components/header.html'%}
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/auth.js' %}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
