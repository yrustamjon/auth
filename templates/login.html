{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cybersecurity Admin Panel</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(ellipse 80% 60% at 50% -10%, rgba(99,102,241,.4) 0%, transparent 60%),
                linear-gradient(160deg, #0d0d1a 0%, #16162a 50%, #1a1030 100%);
            -webkit-font-smoothing: antialiased;
        }

        /* ── Decorative background dots ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle at 1px 1px, rgba(255,255,255,.06) 1px, transparent 0);
            background-size: 32px 32px;
            pointer-events: none;
        }

        /* ── Card ── */
        .login-container {
            background: rgba(255,255,255,.97);
            border-radius: 24px;
            box-shadow: 0 32px 64px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.08);
            width: 100%;
            max-width: 420px;
            padding: 2.75rem 2.25rem 2rem;
            position: relative;
            animation: cardIn .5s cubic-bezier(.4,0,.2,1);
        }

        @keyframes cardIn {
            from { opacity:0; transform:translateY(24px) scale(.97); }
            to   { opacity:1; transform:translateY(0) scale(1); }
        }

        /* ── Header ── */
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            padding: .35rem 1rem;
            border-radius: 999px;
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-bottom: 1.1rem;
            box-shadow: 0 4px 14px rgba(99,102,241,.4);
        }

        .login-header h2 {
            color: #0f172a;
            font-weight: 800;
            font-size: 1.65rem;
            letter-spacing: -.03em;
            margin-bottom: .35rem;
        }

        .login-header p {
            color: #64748b;
            font-size: .88rem;
        }

        /* ── Error ── */
        .error-message {
            background: #fff1f2;
            color: #be123c;
            padding: .72rem 1rem;
            border-radius: 10px;
            margin-bottom: 1.1rem;
            border: 1px solid #fecdd3;
            font-size: .85rem;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: .5rem;
        }

        /* ── Input group ── */
        .input-group {
            margin-bottom: 1.1rem;
            display: flex;
            align-items: stretch;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            transition: border-color .2s, box-shadow .2s;
        }

        .input-group:focus-within {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,.14);
        }

        .input-group-text {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            border: none;
            padding: 0 .9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .input-group-text i { font-size: .95rem; }

        .form-control {
            flex: 1;
            height: 48px;
            padding: 0 .9rem;
            border: none;
            outline: none;
            font-size: .9rem;
            font-family: inherit;
            color: #0f172a;
            background: #fff;
        }

        .form-control::placeholder { color: #94a3b8; }

        .password-toggle {
            background: #fff;
            border: none;
            padding: 0 .85rem;
            cursor: pointer;
            color: #94a3b8;
            font-size: .95rem;
            transition: color .15s;
            display: flex;
            align-items: center;
        }

        .password-toggle:hover { color: #6366f1; }

        /* ── Remember / Forgot ── */
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.35rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: .45rem;
        }

        .remember-me input[type="checkbox"] {
            width: 16px; height: 16px;
            accent-color: #6366f1;
            cursor: pointer;
        }

        .remember-me label {
            color: #475569;
            font-size: .84rem;
            font-weight: 500;
            cursor: pointer;
        }

        .forgot-password {
            color: #6366f1;
            font-size: .84rem;
            font-weight: 600;
            text-decoration: none;
            transition: color .15s;
        }

        .forgot-password:hover { color: #8b5cf6; }

        /* ── Login button ── */
        .btn-login {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: .9rem;
            font-weight: 700;
            font-family: inherit;
            letter-spacing: .02em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(99,102,241,.4);
            transition: all .2s cubic-bezier(.4,0,.2,1);
            margin-bottom: 1.25rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99,102,241,.5);
        }

        .btn-login:active { transform: translateY(0); }

        .btn-login:disabled {
            opacity: .65;
            cursor: not-allowed;
            transform: none;
        }

        /* ── Footer ── */
        .login-footer {
            text-align: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 1.25rem;
            margin-top: .5rem;
        }

        .login-footer p {
            color: #64748b;
            font-size: .82rem;
            margin-bottom: .4rem;
        }

        .login-footer a {
            color: #6366f1;
            font-size: .84rem;
            font-weight: 600;
            text-decoration: none;
            transition: color .15s;
        }

        .login-footer a:hover { color: #8b5cf6; }

        /* ── Security badge ── */
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            margin-top: 1.25rem;
            color: #94a3b8;
            font-size: .75rem;
            font-weight: 500;
        }

        .security-badge i { color: #6366f1; font-size: .78rem; }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .login-container { margin: 1rem; padding: 2rem 1.5rem 1.75rem; }
            .login-header h2 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
             <div class="login-header">
            <div class="admin-badge">
                <i class="fas fa-shield-alt me-2"></i>
                Admin Panel
            </div>
            <h2>Xush kelibsiz!</h2>
            <p>Tizimga kirish uchun ma'lumotlaringizni kiriting</p>
        </div>
            
            <div class="error-message" id="errorMessage">
                Invalid username or password
            </div>
            
            <form id="loginForm">
            <!-- Username input - to'g'irlangan -->
            <div class="input-group">
                <span class="input-group-text">
                    <i class="fas fa-user"></i>
                </span>
                <input type="text"
                       class="form-control"
                       id="username"
                       name="username"
                       placeholder="Foydalanuvchi nomi"
                       required
                       autofocus>
            </div>

            <!-- Password input - to'g'irlangan -->
            <div class="input-group">
                <span class="input-group-text">
                    <i class="fas fa-lock"></i>
                </span>
                <input type="password"
                       class="form-control"
                       id="password"
                       name="password"
                       placeholder="Parol"
                       required>
                <span class="input-group-text password-toggle" id="togglePassword" >
                    <i class="fas fa-eye" id="toggleIcon"></i>
                </span>
            </div>

            <div class="remember-forgot">
                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Eslab qolish</label>
                </div>
                <a href="#" class="forgot-password" onclick="alert('Administrator bilan bog\'laning!'); return false;">
                    <i class="fas fa-key me-1"></i>
                    Parolni unutdingizmi?
                </a>
            </div>

            <button type="submit" class="btn-login" id="loginButton">
                <i class="fas fa-sign-in-alt me-2"></i>
                Tizimga kirish
            </button>

            <div class="login-footer">
                <p>Super admin huquqiga egamisiz?</p>
                <a href="{% url 'system_login' %}">
                    <i class="fas fa-arrow-left me-1"></i>
                    System Login Page 
                </a>
                <br><br>
                <a href="{% url 'home' %}">
                    <i class="fas fa-home me-1"></i>
                    Bosh sahifaga qaytish
                </a>
            </div>

            <div class="security-badge">
                <i class="fas fa-lock"></i>
                <span>Xavfsiz ulanish | SSL sertifikatlangan</span>
                <i class="fas fa-shield-alt"></i>
            </div>
            </form>
            
          

            
           
        </div>
    </div>
<script src="{% static 'js/api.js' %}"></script>
<script src="{% static 'js/auth.js' %}"></script>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const errorMessage = document.getElementById('errorMessage');
            
            try {
                const response = await adminLogin(username, password);
                
                if (response.success) {
                    window.location.href = response.redirect || '/dashboard/';
                } else {
                    errorMessage.textContent = response.message || 'Invalid credentials';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                errorMessage.textContent = 'Network error. Please try again.';
                errorMessage.style.display = 'block';
            }
        });
        
        // Clear error on input
        document.querySelectorAll('#loginForm input').forEach(input => {
            input.addEventListener('input', () => {
                document.getElementById('errorMessage').style.display = 'none';
            });
        });
    </script>
    </body>
</html>
